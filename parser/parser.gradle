/*
 * parser.gradle
 *
 * Sub-project of Jython: a Java port of CPython's pegen-generated parser,
 * producing a Python 3 AST. GeneratedParser.java, TokenTypes.java,
 * AstFactory.java and ast/ are generated by build-tools/python/pegen/generate.py
 * and checked in (see task pegenGen).
 */

plugins {
    id 'java-library'
}

dependencies {
    // JUnit 5 dependencies
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.+'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.+'
}


test {
    useJUnitPlatform {  // JUnit5 as standard
        includeEngines 'junit-jupiter'
    }
}


/*
 * Regenerates the parser from CPython's grammar. The output is checked in, so
 * this is not part of compileJava; run it after changing the generator or the
 * grammar. Needs Python >= 3.10 and a CPython checkout:
 *     ./gradlew :parser:pegenGen [-Ppegen.python=python3] [-Ppegen.cpython=../cpython]
 * pegen.args passes further options to generate.py (see its help), such as
 * --skip-actions, for a recognizer that builds no AST.
 */
task pegenGen(type: Exec,
        description: 'Regenerate the PEG parser from CPython\'s grammar') {
    def root = getProject().getRootProject()
    executable findProperty('pegen.python') ?: 'python3'
    environment('PYTHONDONTWRITEBYTECODE', '1')
    args root.file('build-tools/python/pegen/generate.py')
    args '--cpython', root.file(findProperty('pegen.cpython') ?: '../cpython')
    def extra = findProperty('pegen.args')
    if (extra) {
        args extra.toString().tokenize()
    }
}
